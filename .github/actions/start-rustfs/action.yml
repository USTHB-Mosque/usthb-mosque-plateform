# Boots the S3-compatible object storage both CI jobs need: the storage
# integration test (`test`) and the e2e seed's `media-e2e` bucket (`e2e`).
#
# One definition on purpose — the image is pinned by digest, so a bump has to be
# a single edit rather than two that can drift apart.
name: Start object storage
description: Run a RustFS container on 127.0.0.1:9000 and wait until it is healthy.

inputs:
  name:
    description: Container name (per job, so the logs stay tellable apart).
    required: false
    default: mosque-ci-rustfs

runs:
  using: composite
  steps:
    - name: Boot RustFS and wait for its health endpoint
      shell: bash
      run: |
        docker run -d --name "${{ inputs.name }}" -p 127.0.0.1:9000:9000 \
          -e RUSTFS_ACCESS_KEY=mosque -e RUSTFS_SECRET_KEY=mosque-secret \
          rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then exit 0; fi
          sleep 2
        done
        docker logs "${{ inputs.name }}"
        exit 1
