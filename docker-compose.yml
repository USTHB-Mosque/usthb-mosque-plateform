# One stack for local Postgres/MinIO and VPS deployment (see ADR 0003).
#
#   docker compose up -d db minio minio-init     # host-run next dev
#   docker compose up --build --detach            # VPS: app + Caddy
#
# Migrations run in the one-shot `migrate` service; the app waits for it to
# finish and never starts if a migration fails. Media stays in the named
# minio-data volume even after docker compose down.

x-deploy-env: &deploy-env
  # Inside the compose network the database is reachable as `db`, not
  # 127.0.0.1 — override whatever .env says.
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-usthb_mosque}
  # A container's 127.0.0.1 is not the host's: override the host-facing .env.
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-media}
  S3_REGION: ${S3_REGION:-local}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mosque}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mosque-secret}
  NODE_ENV: production
  PAYLOAD_PUSH: 'false'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      <<: *deploy-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: 'no'
    env_file:
      - .env
    environment:
      <<: *deploy-env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-usthb_mosque}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-usthb_mosque}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-mosque}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-mosque-secret}
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${S3_BUCKET:-media}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-mosque}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-mosque-secret}
      S3_BUCKET: ${S3_BUCKET:-media}

volumes:
  pgdata:
  minio-data:
  caddy-data:
  caddy-config:
