# One stack for local Postgres + object storage and VPS deployment (see ADR 0003).
#
#   docker compose up -d db rustfs     # host-run next dev
#   docker compose up --build --detach # VPS: app + Caddy
#
# Migrations and bucket creation run in the one-shot `migrate` service; the app
# waits for it to finish and never starts if either step fails. Media stays in
# the named rustfs-data volume even after docker compose down.

x-deploy-env: &deploy-env
  # Use the host-facing URL from .env, replacing only its host and port in
  # payload.config.ts. The URL retains percent-encoded passwords.
  COMPOSE_DB_HOST: db
  # A container's 127.0.0.1 is not the host's: override the host-facing .env.
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: ${S3_BUCKET:-media}
  S3_REGION: ${S3_REGION:-local}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mosque}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mosque-secret}
  NODE_ENV: production
  PAYLOAD_PUSH: 'false'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      <<: *deploy-env
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  # Ensures the media bucket exists, then applies migrations. RustFS ships no
  # `mc` client, so the bucket is created with the same AWS SDK the app uses.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: 'no'
    env_file:
      - .env
    environment:
      <<: *deploy-env
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm storage:init && pnpm exec payload migrate']

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-usthb_mosque}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-usthb_mosque}']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
    ports:
      - '127.0.0.1:${RUSTFS_API_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-mosque}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-mosque-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    healthcheck:
      # RustFS serves the S3-compatible liveness path MinIO clients expect.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  rustfs-data:
  caddy-data:
  caddy-config:
